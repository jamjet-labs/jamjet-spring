name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  schedule:
    # Weekly, so a new Spring AI release candidate that breaks the build shows up
    # even when nobody pushes.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  release-version:
    name: Version and coordinates against Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, for --allow-released-tag
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      # Fails if a module's version is already on Central (unless this branch
      # released it from an ancestor tag v<version> and has not bumped yet),
      # versions disagree, or a README shows dev.jamjet coordinates nobody can
      # download. mvn deploy runs the same script without the flag.
      # --allow-pending-release: on a -SNAPSHOT line, docs may show the release
      # this line prepared (its last non-SNAPSHOT version) before it is published.
      - run: python3 scripts/check_release_version.py --allow-released-tag --allow-pending-release

  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -Dgpg.skip verify

  runtime-integration:
    name: Integration tests against the JamJet runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # RuntimeContractIT starts jamjetdev/jamjet:<JamjetTestContainer.DEFAULT_TAG>
      # with Testcontainers and asserts what the runtime recorded. 0.5.0 predates
      # external_fn nodes, so calls are recorded under the 1.0.0 wait workflow.
      - env:
          JAMJET_IT_EXPECT_VERSION: "1.0.0"
        run: mvn -B -Dgpg.skip -Dmaven.javadoc.skip=true -Pit -pl jamjet-spring-boot-starter-test -am verify

  runtime-integration-main:
    name: Integration tests against a runtime built from jamjet main (pinned)
    runs-on: ubuntu-latest
    # No published image has jamjet PR #169 (registration refuses node kinds
    # nothing executes, such as the wait node 0.2.x registered) or #178 yet, so
    # this job builds jamjet-server from a pinned jamjet main commit and runs the
    # same tests against it. Move the pin on purpose, in its own change, when the
    # runtime changes the work-item protocol.
    env:
      JAMJET_RUNTIME_REF: 989b97b051716400b54ab29233fb24e5aed4e5f2 # jamjet main, 2026-11-08 (#180)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jamjet-labs/jamjet
          ref: ${{ env.JAMJET_RUNTIME_REF }}
          path: jamjet-runtime
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: jamjet-runtime/runtime
      - name: Build jamjet-server
        working-directory: jamjet-runtime/runtime
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          echo "jamjet at $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$JAMJET_RUNTIME_REF"
          # The server embeds the web UI; an empty page is enough for the API.
          mkdir -p ../web/dist && echo '<!DOCTYPE html><html><body></body></html>' > ../web/dist/index.html
          cargo build --locked -p jamjet-api --bin jamjet-server
      - name: Start the runtime in dev mode on a temporary SQLite database
        run: |
          mkdir -p "$RUNNER_TEMP/jamjet"
          JAMJET_DEV_MODE=1 JAMJET_PORT=7799 DATABASE_URL="sqlite://$RUNNER_TEMP/jamjet/runtime.db?mode=rwc" \
            nohup jamjet-runtime/runtime/target/debug/jamjet-server > "$RUNNER_TEMP/jamjet/server.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7799/health; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/jamjet/server.log"
          exit 1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - env:
          JAMJET_IT_RUNTIME_URL: http://127.0.0.1:7799
          JAMJET_IT_EXPECT_VERSION: "2.0.0"
        run: mvn -B -Dgpg.skip -Dmaven.javadoc.skip=true -Pit -pl jamjet-spring-boot-starter-test -am verify
      - name: Runtime log
        if: failure()
        run: tail -n 300 "$RUNNER_TEMP/jamjet/server.log"

  spring-ai-next:
    name: Build and unit tests against the newest Spring AI 2.1
    runs-on: ubuntu-latest
    # Early warning only: a break in a Spring AI release candidate shows up here
    # without turning the run red for changes that did not cause it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Resolve the newest Spring AI 2.1 and the Spring Boot it is built with
        id: versions
        run: |
          ai=$(curl -fsSL https://repo1.maven.org/maven2/org/springframework/ai/spring-ai-bom/maven-metadata.xml \
            | grep -o '<version>2\.1\.[^<]*</version>' | sed 's/<[^>]*>//g' | tail -1)
          boot=$(curl -fsSL "https://repo1.maven.org/maven2/org/springframework/ai/spring-ai-autoconfigure-model-chat-client/$ai/spring-ai-autoconfigure-model-chat-client-$ai.pom" \
            | grep -A1 '<artifactId>spring-boot-autoconfigure</artifactId>' | grep -o '<version>[^<]*' | sed 's/<version>//' | head -1)
          # Fetched text: accept only plain version strings before using them.
          pattern='^[0-9]+\.[0-9]+\.[0-9]+(-(M|RC)[0-9]+)?$'
          if [[ ! "$ai" =~ $pattern || ! "$boot" =~ $pattern ]]; then
            echo "unexpected versions: spring-ai='$ai' spring-boot='$boot'" >&2
            exit 1
          fi
          echo "Spring AI $ai with Spring Boot $boot"
          echo "spring-ai=$ai" >> "$GITHUB_OUTPUT"
          echo "spring-boot=$boot" >> "$GITHUB_OUTPUT"
      - env:
          SPRING_AI_VERSION: ${{ steps.versions.outputs.spring-ai }}
          SPRING_BOOT_VERSION: ${{ steps.versions.outputs.spring-boot }}
        run: >-
          mvn -B -Dgpg.skip -Dmaven.javadoc.skip=true
          "-Dspring-ai.version=$SPRING_AI_VERSION"
          "-Dspring-boot.version=$SPRING_BOOT_VERSION"
          verify
