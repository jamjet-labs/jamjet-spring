name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  release-version:
    name: Version and coordinates against Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fails if a module's version is already on Central, versions disagree,
      # or a README shows dev.jamjet coordinates nobody can download.
      - run: python3 scripts/check_release_version.py

  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -Dgpg.skip verify

  runtime-integration:
    name: Integration tests against the JamJet runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # RuntimeContractIT starts jamjetdev/jamjet:<JamjetTestContainer.DEFAULT_TAG>
      # with Testcontainers and asserts what the runtime recorded.
      - run: mvn -B -Dgpg.skip -Dmaven.javadoc.skip=true -Pit -pl jamjet-spring-boot-starter-test -am verify
